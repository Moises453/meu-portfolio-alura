<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de tarefas · Moisés Dias</title><style>body{font:18px Arial;background:linear-gradient(#bcecff,#edfff4);margin:0;padding:6rem 1rem;color:#123}main{max-width:620px;margin:auto;background:#ffffffdd;border-radius:24px;padding:2rem;box-shadow:0 12px 30px #1786a655}input,button{font:inherit;padding:.7rem;border-radius:10px;border:1px solid #39a}button{background:#159b72;color:#fff;cursor:pointer}li{margin:.7rem 0;cursor:pointer}li.done{text-decoration:line-through;opacity:.55}</style><main><h1>Lista de tarefas</h1><input id="t" placeholder="Ex.: revisar exercícios"><button onclick="a()">Adicionar</button><ul id="l"></ul><a href="projetos.html">← Voltar aos projetos</a></main><script>function a(){if(!t.value.trim())return;let x=document.createElement('li');x.textContent=t.value;x.onclick=()=>x.classList.toggle('done');l.append(x);t.value='';t.focus()}</script></html>
