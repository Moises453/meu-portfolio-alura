<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Número secreto · Moisés Dias</title><style>body{font:18px Arial;background:linear-gradient(#7edcff,#dfffe9);margin:0;padding:6rem 1rem;text-align:center;color:#123}main{max-width:520px;margin:auto;background:#ffffffdd;border-radius:24px;padding:2rem;box-shadow:0 12px 30px #1786a655}input,button{font:inherit;padding:.7rem;border-radius:10px;border:1px solid #39a}button{background:#138dc3;color:#fff;cursor:pointer}</style><main><p>PROJETO DE ESTUDO · JAVASCRIPT</p><h1>Jogo do número secreto</h1><p>Escolha um número de 1 a 20.</p><input id="g" type="number" min="1" max="20"><button onclick="j()">Tentar</button><p id="m"></p><a href="projetos.html">← Voltar aos projetos</a></main><script>const n=Math.floor(Math.random()*20)+1;let t=0;function j(){t++;let v=+g.value;m.textContent=v===n?'Acertou em '+t+' tentativa(s)!':v<n?'Tente um número maior.':'Tente um número menor.'}</script></html>
